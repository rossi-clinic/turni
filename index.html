<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1F1D1B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icona-180.png">
<link rel="icon" href="icona-192.png" sizes="192x192">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Turni">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Turni Rossi Clinic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#FAF8F5;
  --surface:#FFFDFA;
  --surface-2:#F1ECE7;
  --line:#E6DFD6;
  --line-2:#D9D2C9;
  --ink:#1F1D1B;
  --ink-2:#6E6862;
  --ink-3:#98918A;
  --gold:#C0A35F;
  --gold-deep:#8F7842;
  --gold-wash:rgba(192,163,95,.13);
  --ok:#56795F;
  --ok-wash:rgba(86,121,95,.12);
  --wait:#8A7E6E;
  --wait-wash:rgba(138,126,110,.10);
  --no:#97463C;
  --no-wash:rgba(151,70,60,.10);
  --shadow:0 1px 2px rgba(31,29,27,.05), 0 8px 24px -16px rgba(31,29,27,.25);
  --display:"Jost","Futura","Avenir Next",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151412;
    --surface:#1F1D1B;
    --surface-2:#272320;
    --line:#332E29;
    --line-2:#413A33;
    --ink:#F1ECE7;
    --ink-2:#A9A199;
    --ink-3:#7D766F;
    --gold:#C9AF6D;
    --gold-deep:#E0C98E;
    --gold-wash:rgba(201,175,109,.14);
    --ok:#8CB396;
    --ok-wash:rgba(140,179,150,.14);
    --wait:#A2978A;
    --wait-wash:rgba(162,151,138,.12);
    --no:#D08379;
    --no-wash:rgba(208,131,121,.14);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#151412;
  --surface:#1F1D1B;
  --surface-2:#272320;
  --line:#332E29;
  --line-2:#413A33;
  --ink:#F1ECE7;
  --ink-2:#A9A199;
  --ink-3:#7D766F;
  --gold:#C9AF6D;
  --gold-deep:#E0C98E;
  --gold-wash:rgba(201,175,109,.14);
  --ok:#8CB396;
  --ok-wash:rgba(140,179,150,.14);
  --wait:#A2978A;
  --wait-wash:rgba(162,151,138,.12);
  --no:#D08379;
  --no-wash:rgba(208,131,121,.14);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--body);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--gold-deep)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- intestazione ---------- */
.top{
  background:var(--bg);
  border-bottom:1px solid var(--line);
}
.top-in{
  max-width:1180px;margin:0 auto;padding:14px 20px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
.mark{display:flex;align-items:center;gap:16px;min-width:0}
svg.logo{display:block;width:158px;height:auto;flex:none}
.mark-txt{border-left:1px solid var(--line-2);padding-left:16px}
@media (max-width:620px){
  svg.logo{width:150px}
  .mark-txt{border-left:0;padding-left:0;flex-basis:100%}
}
.mark-sub{
  font-family:var(--display);font-size:10.5px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--ink-3);white-space:nowrap;
}
.who{margin-left:auto;display:flex;align-items:center;gap:8px}
.who label{
  font-family:var(--display);font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-3);
}
select.role{
  appearance:none;background:var(--surface);border:1px solid var(--line-2);
  border-radius:999px;padding:7px 30px 7px 13px;font-size:13.5px;font-weight:500;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);
  background-position:calc(100% - 15px) 52%, calc(100% - 10px) 52%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;cursor:pointer;
}
.blades{display:block;width:100%;height:10px;opacity:.75}

/* ---------- identità ---------- */
.utente{display:flex;align-items:center;gap:10px}
.utente .nome{font-size:13.5px;font-weight:500;line-height:1.2}
.utente .ruolo{font-family:var(--display);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.utente .tondo{
  width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:var(--gold-wash);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);
  font-family:var(--display);font-size:14px;color:var(--gold-deep);
}
.utente .tondo.super{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* ---------- schermata di accesso ---------- */
.accesso{max-width:1180px;margin:0 auto;padding:48px 20px 80px;display:flex;justify-content:center}
.accesso-box{width:100%;max-width:392px}
.accesso-box h1{font-size:22px;font-weight:300;margin-bottom:4px}
.accesso-box .intro{color:var(--ink-2);font-size:13.5px;margin:0 0 22px}
.accesso-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.errore{
  background:var(--no-wash);color:var(--no);border:1px solid color-mix(in srgb,var(--no) 30%,transparent);
  border-radius:7px;padding:9px 12px;font-size:13px;margin-bottom:14px;
}
.regola{font-size:12.5px;color:var(--ink-3);margin:-6px 0 14px}
.accesso-nota{margin-top:18px;font-size:12.5px;color:var(--ink-3);line-height:1.55}
.accesso-nota strong{color:var(--ink-2);font-weight:500}
.scadenza{font-size:12px;color:var(--ink-3)}
.scadenza.vicina{color:var(--no)}

/* ---------- navigazione ---------- */
nav.tabs{
  position:sticky;top:0;z-index:40;
  border-bottom:1px solid var(--line);
  background:var(--surface);
}
.tabs-in{
  max-width:1180px;margin:0 auto;padding:0 12px;
  display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;
}
.tabs-in::-webkit-scrollbar{display:none}
.tab{
  background:none;border:0;border-bottom:2px solid transparent;
  padding:12px 12px 10px;cursor:pointer;white-space:nowrap;
  font-family:var(--display);font-size:13px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-2);
}
.tab:hover{color:var(--ink)}
.tab[aria-current="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.tab .dot{
  display:inline-block;min-width:17px;padding:0 5px;margin-left:6px;
  background:var(--gold);color:#1F1D1B;border-radius:999px;
  font-family:var(--body);font-size:11px;font-weight:600;line-height:17px;
  text-align:center;letter-spacing:0;
}

/* ---------- impianto ---------- */
main{max-width:1180px;margin:0 auto;padding-block:24px 72px;padding-left:20px;padding-right:20px}
.sect-head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.sect-head h2{font-size:24px;letter-spacing:.01em;font-weight:300}
.sect-head p{margin:0;color:var(--ink-2);font-size:13.5px;max-width:62ch}
.ground{height:1px;background:var(--gold);opacity:.55;margin:0 0 20px}
.eyebrow{
  font-family:var(--display);font-size:10.5px;letter-spacing:.19em;
  text-transform:uppercase;color:var(--ink-3);
}
.stack{display:flex;flex-direction:column;gap:18px}
.cols{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:880px){.cols{grid-template-columns:1fr}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.panel > h3{
  font-size:13px;font-family:var(--display);letter-spacing:.15em;text-transform:uppercase;
  padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.panel > h3 .r{margin-left:auto;font-family:var(--body);font-size:12.5px;letter-spacing:0;text-transform:none;color:var(--ink-2)}
.pad{padding:16px}

/* ---------- tessere numeriche ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:1px;background:var(--line)}
.tile{background:var(--surface);padding:15px 16px 16px}
.tile .k{font-family:var(--display);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.tile .v{font-size:27px;font-family:var(--display);font-weight:300;font-variant-numeric:tabular-nums;line-height:1.25;margin-top:4px}
.tile .v small{font-size:14px;color:var(--ink-2)}
.tile .n{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.tile .n.pos{color:var(--ok)} .tile .n.neg{color:var(--no)}

/* ---------- giorni ---------- */
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.day{
  border:1px solid var(--line);border-radius:8px;padding:11px 12px 12px;
  background:var(--surface);display:flex;flex-direction:column;gap:7px;min-height:104px;
}
.day.oggi{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold-wash)}
.day .dh{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.day .dn{font-family:var(--display);font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2)}
.day .dd{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.day .orario{font-size:16px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.day .vuoto{font-size:13px;color:var(--ink-3);font-style:italic}

.chip{
  display:inline-flex;align-items:center;gap:6px;align-self:flex-start;
  padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:500;
  border:1px solid transparent;white-space:nowrap;
}
.chip::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.c-M{color:var(--gold-deep);background:var(--gold-wash);border-color:var(--gold-wash)}
.c-P{color:var(--ink-2);background:var(--surface-2);border-color:var(--line)}
.c-S{color:var(--ok);background:var(--ok-wash);border-color:var(--ok-wash)}
.c-SW{color:var(--ink-2);background:transparent;border-color:var(--ink-3);border-style:dashed}
.c-R{color:var(--ink-3);background:transparent;border-color:var(--line)}
.c-F{color:var(--no);background:var(--no-wash);border-color:var(--no-wash)}
.c-PR{color:var(--wait);background:var(--wait-wash);border-color:var(--wait-wash)}
.st{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:500}
.st::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.st-attesa{color:var(--wait);background:var(--wait-wash)}
.st-ok{color:var(--ok);background:var(--ok-wash)}
.st-no{color:var(--no);background:var(--no-wash)}
.st-bozza{color:var(--ink-2);background:var(--surface-2)}
.st-revisione{color:var(--gold-deep);background:var(--gold-wash)}

/* ---------- griglia settimanale ---------- */
.gridwrap{overflow-x:auto;border-top:1px solid var(--line)}
table.griglia{border-collapse:collapse;width:100%;min-width:820px}
table.griglia th,table.griglia td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;vertical-align:top}
table.griglia th:last-child,table.griglia td:last-child{border-right:0}
table.griglia thead th{
  background:var(--surface-2);padding:9px 10px;text-align:left;
  font-family:var(--display);font-weight:400;font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2);
  position:sticky;top:0;z-index:2;
}
table.griglia thead th span{display:block;font-family:var(--body);letter-spacing:0;text-transform:none;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
th.persona,td.persona{
  position:sticky;left:0;z-index:3;background:var(--surface);
  min-width:158px;border-right:1px solid var(--line-2);
}
thead th.persona{z-index:4;background:var(--surface-2)}
td.persona{padding:10px 12px}
td.persona .nm{font-weight:500}
td.persona .ms{font-size:12px;color:var(--ink-3)}
td.persona .tot{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;margin-top:3px}
.cella{width:100%;min-height:58px;border:0;background:none;padding:8px;text-align:left;display:flex;flex-direction:column;gap:4px;cursor:default}
button.cella{cursor:pointer}
button.cella:hover{background:var(--gold-wash)}
.cella .hh{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.cella .add{color:var(--ink-3);font-size:18px;line-height:1;opacity:0;font-family:var(--display)}
button.cella:hover .add{opacity:1}
.col-oggi{background:var(--gold-wash)}

/* ---------- righe elenco ---------- */
.riga{display:flex;gap:13px;padding:13px 16px;border-bottom:1px solid var(--line);align-items:flex-start;flex-wrap:wrap}
.riga:last-child{border-bottom:0}
.riga .main{flex:1 1 260px;min-width:0}
.riga .tt{font-weight:500}
.riga .sub{font-size:13px;color:var(--ink-2);margin-top:2px}
.riga .note{font-size:13px;color:var(--ink-2);margin-top:6px;padding-left:11px;border-left:2px solid var(--line-2);font-style:italic}
.riga .az{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---------- comandi ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 16px;border-radius:999px;border:1px solid var(--line-2);
  background:var(--surface);color:var(--ink);cursor:pointer;
  font-family:var(--display);font-size:13px;letter-spacing:.05em;
  transition:background .15s,border-color .15s;
}
.btn:hover{border-color:var(--ink-3)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#211E19;font-weight:500}
.btn.gold:hover{background:var(--gold-deep);border-color:var(--gold-deep);color:#FFF9EC}
.btn.ok{color:var(--ok);border-color:var(--ok)}
.btn.ok:hover{background:var(--ok-wash)}
.btn.no{color:var(--no);border-color:var(--no)}
.btn.no:hover{background:var(--no-wash)}
.btn.sm{padding:6px 12px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:9px;flex-wrap:wrap}

/* ---------- moduli ---------- */
.campo{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.campo > span{font-family:var(--display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.campo input,.campo select,.campo textarea{
  background:var(--bg);border:1px solid var(--line-2);border-radius:7px;padding:9px 11px;width:100%;
}
.campo textarea{min-height:64px;resize:vertical}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.duo{grid-template-columns:1fr}}

/* ---------- grafico ore ---------- */
.chart{display:flex;align-items:flex-end;gap:9px;height:184px;padding:26px 4px 0;position:relative;overflow-x:auto}
.target{
  position:absolute;left:0;right:0;border-top:1px dashed var(--gold);opacity:.75;
}
.target span{
  position:absolute;right:0;top:-9px;background:var(--surface);padding:0 5px;
  font-size:11px;color:var(--gold-deep);font-variant-numeric:tabular-nums;
}
.bar{flex:1 1 0;min-width:30px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%}
.bar .fill{width:100%;background:var(--surface-2);border:1px solid var(--line-2);border-bottom:0;border-radius:3px 3px 0 0;position:relative}
.bar.cur .fill{background:var(--gold-wash);border-color:var(--gold)}
.bar .val{font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--ink-2);position:absolute;top:-17px;left:0;right:0;text-align:center}
.bar .lab{font-size:11px;color:var(--ink-3);white-space:nowrap}
.axis{border-top:1px solid var(--line-2);margin-top:-1px}

table.dati{width:100%;border-collapse:collapse}
table.dati th,table.dati td{padding:9px 16px;text-align:left;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.dati th{font-family:var(--display);font-weight:400;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
table.dati td.num,table.dati th.num{text-align:right}
table.dati tr:last-child td{border-bottom:0}

/* ---------- finestra ---------- */
.velo{position:fixed;inset:0;background:rgba(31,29,27,.45);display:flex;align-items:flex-end;justify-content:center;z-index:60;padding:0}
@media (min-width:600px){.velo{align-items:center;padding:20px}}
.modale{
  background:var(--surface);width:100%;max-width:460px;max-height:92vh;overflow:auto;
  border:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:0 24px 60px -20px rgba(0,0,0,.5);
}
@media (min-width:600px){.modale{border-radius:14px}}
.modale h3{padding:16px;border-bottom:1px solid var(--line);font-size:17px;display:flex;gap:12px;align-items:center}
.modale h3 button{margin-left:auto;background:none;border:0;font-size:22px;line-height:1;color:var(--ink-3);cursor:pointer;padding:0 4px}
.modale .corpo{padding:16px}
.modale .piede{padding:14px 16px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}

.avviso{
  display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border-radius:8px;
  background:var(--gold-wash);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);font-size:13.5px;
}
.avviso .eyebrow{margin-bottom:2px}
.vuoto-box{padding:26px 16px;text-align:center;color:var(--ink-3);font-size:13.5px}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:80;
  background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:13.5px;
  box-shadow:0 12px 30px -12px rgba(0,0,0,.6);
}
.legenda{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line)}
.mini{font-size:12.5px;color:var(--ink-2)}
.pill-mans{
  background:none;border:1px dashed var(--line-2);border-radius:999px;padding:2px 9px;
  font-size:12px;color:var(--ink-3);cursor:pointer;
}
.pill-mans:hover{border-color:var(--gold);color:var(--gold-deep)}
.piede-pag{
  max-width:1180px;margin:0 auto;padding:22px 20px 40px;color:var(--ink-3);font-size:12.5px;
  border-top:1px solid var(--line);display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between;
}
/* ---------- stampa (PDF) ---------- */
.esporta-riga{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
#stampa{display:none}
@media print{
  body>*{display:none !important}
  body>#stampa{display:block !important}
  @page{size:A4 portrait;margin:14mm}
  body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pt-doc{font-family:Inter,system-ui,sans-serif;color:#1F1D1B;font-size:11.5px;line-height:1.45}
  .pt-top{border-bottom:2px solid #C0A35F;padding-bottom:9px;margin-bottom:16px}
  .pt-marchio{font-family:Jost,Inter,sans-serif;letter-spacing:.24em;font-size:10.5px;color:#C0A35F;text-transform:uppercase}
  .pt-tit{font-family:Jost,Inter,sans-serif;font-size:19px;font-weight:500;margin-top:7px}
  .pt-sot{font-size:11px;color:#6E6862;margin-top:3px}
  .pt-h{font-family:Jost,Inter,sans-serif;font-size:13px;font-weight:500;margin:18px 0 2px}
  .pt-tab{width:100%;border-collapse:collapse;margin:8px 0 6px;font-size:11px}

<script>

/* ---------- costanti ---------- */
const TIPI = {
  M : {nome:"Apertura",   inizio:"09:00", fine:"18:00", pausaDa:"12:00", pausaA:"13:00", ore:8, lavoro:true},
  P : {nome:"Chiusura",   inizio:"12:00", fine:"20:00", pausaDa:"",      pausaA:"",      ore:8, lavoro:true},
  S : {nome:"Assistenza", inizio:"08:00", fine:"14:00", pausaDa:"",      pausaA:"",      ore:6, lavoro:true},
  SW: {nome:"Smart",      inizio:"09:00", fine:"18:00", pausaDa:"12:00", pausaA:"13:00", ore:8, lavoro:true},
  R : {nome:"Riposo",     ore:0, lavoro:false},
  F : {nome:"Ferie",      ore:0, lavoro:false},
  PR: {nome:"Permesso",   ore:0, lavoro:false}
};
const GIORNI = ["Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato","Domenica"];
const GIORNI_B = ["Lun","Mar","Mer","Gio","Ven","Sab","Dom"];
const MESI = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
const Mese = i => MESI[i].charAt(0).toUpperCase()+MESI[i].slice(1);
const FERIE_ANNUE = 26;      // giorni
const PERMESSI_ANNUI = 32;   // ore
const CHIAVE = "rc_turni_v5";

/* ---------- date ---------- */
const OGGI = new Date(2026, 8, 13);
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function daIso(s){ const [a,m,g]=s.split("-").map(Number); return new Date(a,m-1,g); }
function lunedi(d){ const x=new Date(d); const w=(x.getDay()+6)%7; x.setDate(x.getDate()-w); x.setHours(0,0,0,0); return x; }
function piuGiorni(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function chiaveSett(d){ return iso(lunedi(d)); }
function giorniSett(k){ const l=daIso(k); return Array.from({length:7},(_,i)=>iso(piuGiorni(l,i))); }
function etichettaSett(k){
  const l=daIso(k), d=piuGiorni(l,6);
  const a = l.getMonth()===d.getMonth()
    ? `${l.getDate()}–${d.getDate()} ${Mese(d.getMonth())}`
    : `${l.getDate()} ${Mese(l.getMonth()).slice(0,3)} – ${d.getDate()} ${Mese(d.getMonth()).slice(0,3)}`;
  return a;
}
function dataBreve(s){ const d=daIso(s); return `${d.getDate()} ${Mese(d.getMonth()).slice(0,3)}`; }
function dataLunga(s){ const d=daIso(s); return `${GIORNI[(d.getDay()+6)%7]} ${d.getDate()} ${Mese(d.getMonth())}`; }
function minuti(o){ if(!o) return null; const [h,m]=o.split(":").map(Number); return h*60+m; }
/** Ore effettive: durata del turno meno la pausa, se la pausa cade dentro il turno. */
function oreNette(inizio, fine, pausaDa, pausaA){
  const i = minuti(inizio), f = minuti(fine);
  if(i===null || f===null) return 0;
  let durata = f - i; if(durata < 0) durata += 1440;          // turno a cavallo della mezzanotte
  const pa = minuti(pausaDa), pb = minuti(pausaA);
  let pausa = 0;
  if(pa!==null && pb!==null && pb > pa) pausa = Math.min(pb - pa, durata);
  return Math.max(0, Math.round(((durata - pausa) / 60) * 100) / 100);
}
/** La pausa del turno, o quella predefinita del tipo. */
function pausaDi(t){
  if(!t) return {da:"", a:""};
  if(t.pausaDa !== undefined) return {da:t.pausaDa || "", a:t.pausaA || ""};
  const T = TIPI[t.tipo] || {};
  return {da:T.pausaDa || "", a:T.pausaA || ""};
}
function testoPausa(t){
  const p = pausaDi(t);
  return p.da && p.a ? `pausa ${p.da}–${p.a}` : "";
}
function nOre(n){ return Number(n).toLocaleString("it-IT",{maximumFractionDigits:1}); }

function erroriPassword(pw){
  const mancano = [];
  if(pw.length < PW_MIN)        mancano.push(`almeno ${PW_MIN} caratteri in tutto`);
  if(!/[A-Za-zÀ-ÿ]/.test(pw))   mancano.push("una lettera");
  if(!/[0-9]/.test(pw))         mancano.push("un numero");
  if(!/[^A-Za-z0-9À-ÿ]/.test(pw)) mancano.push("un carattere speciale");
  if(!mancano.length) return null;
  return "Alla password manca " + (mancano.length === 1 ? mancano[0] : mancano.slice(0,-1).join(", ") + " e " + mancano.slice(-1)) + ".";
}

/* ---------- accesso ---------- */
function sale(){
  const a = new Uint8Array(8);
  if(self.crypto && crypto.getRandomValues) crypto.getRandomValues(a);
  else for(let i=0;i<a.length;i++) a[i] = Math.floor(Math.random()*256);
  return [...a].map(x=>x.toString(16).padStart(2,"0")).join("");
}
async function impronta(pw, salt){
  const testo = salt + "\u00b7" + pw;
  if(self.crypto && crypto.subtle && crypto.subtle.digest){
    const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(testo));
    return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
  }
  let h = 5381;
  for(const c of testo) h = ((h<<5)+h+c.charCodeAt(0))>>>0;
  return "f"+h.toString(16);
}
function utente(u){ return (S.utenti||{})[u]; }
function giorniPassword(u){
  const x = utente(u);
  if(!x || !x.impostataIl) return null;
  return Math.floor((Date.now() - new Date(x.impostataIl).getTime())/86400000);
}
function passwordScaduta(u){
  const g = giorniPassword(u);
  return g !== null && g >= GIORNI_PASSWORD;
}
function entra(u){
  const x = utente(u);
  sess = {utente:u, ruolo:x.ruolo, personaId:x.personaId, nome:x.nome};

function turniDi(pid, k){ const gg=giorniSett(k); return S.turni.filter(t=>t.persona===pid && gg.includes(t.data)); }
function turnoIn(pid, data){ return S.turni.find(t=>t.persona===pid && t.data===data); }
function oreTurno(t){ if(!t) return 0; if(t.tipo==="PR") return 0; return TIPI[t.tipo].lavoro ? (t.ore ?? TIPI[t.tipo].ore) : 0; }
function oreSett(pid,k){ return turniDi(pid,k).reduce((s,t)=>s+oreTurno(t),0); }
function oreMese(pid, anno, mese){
  return S.turni.filter(t=>{
    if(t.persona!==pid) return false;
    const d=daIso(t.data); return d.getFullYear()===anno && d.getMonth()===mese;
  }).reduce((s,t)=>s+oreTurno(t),0);
}
function personeSett(k){
  const s = S.settimane[k] || {extra:[]};
  const extra = (s.extra||[]).map(e=>({...e, temporaneo:true}));
  return [...S.persone, ...extra];
}
function statoSett(k){ return (S.settimane[k] && S.settimane[k].stato) || "bozza"; }
function assicuraSett(k){ if(!S.settimane[k]) S.settimane[k] = {stato:"bozza", vistoOwner:null, extra:[]}; return S.settimane[k]; }

function ferieUsate(pid){
  const anno = OGGI.getFullYear();
  return S.turni.filter(t=>t.persona===pid && t.tipo==="F" && daIso(t.data).getFullYear()===anno).length;
}
function ferieFuture(pid){
  return S.turni.filter(t=>t.persona===pid && t.tipo==="F" && daIso(t.data)>OGGI).length;
}
function permessiUsati(pid){
  const anno = OGGI.getFullYear();
  return S.turni.filter(t=>t.persona===pid && t.tipo==="PR" && daIso(t.data).getFullYear()===anno)
                .reduce((s,t)=>s+(t.ore||0),0);
}
function inAttesa(){ return S.richieste.filter(r=>r.stato==="in_attesa"); }
function mieRichieste(pid){ return S.richieste.filter(r=>r.da===pid).sort((a,b)=>b.creata.localeCompare(a.creata)); }

const esc = s => String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function chipTurno(t){
  if(!t) return "";
  const T = TIPI[t.tipo];
  const extra = t.tipo==="PR" ? ` ${nOre(t.ore||0)}h` : "";
  return `<span class="chip c-${t.tipo}">${T.nome}${extra}</span>`;
}
function orarioTurno(t){
  if(!t) return "";
  const T = TIPI[t.tipo];
  if(!T.lavoro) return "";
  const da = t.inizio || T.inizio, a = t.fine || T.fine;
  return `${da}–${a}`;
}
function stChip(stato){
  const m = {in_attesa:["st-attesa","In attesa"], approvata:["st-ok","Approvata"], rifiutata:["st-no","Rifiutata"],
             bozza:["st-bozza","Bozza"], in_revisione:["st-revisione","In revisione"], pubblicata:["st-ok","Pubblicata"]};
  const [c,l] = m[stato] || ["st-bozza",stato];
  return `<span class="st ${c}">${l}</span>`;
}

  const barre = sett.map(s=>`
    <div class="bar${s.cur?" cur":""}">
      <div class="fill" style="height:${Math.max(3,(s.ore/max)*100)}%"><span class="val">${nOre(s.ore)}</span></div>

  for(let m=0; m<=OGGI.getMonth(); m++){
    const o = oreMese(pid, OGGI.getFullYear(), m);
    if(o>0 || m===OGGI.getMonth()) mesi.push({m, ore:o});
  }
  const attese = p.oreSett*4.33;

  return `
  <div class="sect-head">
    <h2>Le mie ore</h2>
    <p>Ore effettivamente a turno. Ferie, permessi e riposi non contano come ore lavorate.</p>

function rigaRichiesta(r, conAzioni){
  const p = per(r.da);
  let tt="", sub="";
  if(r.tipo==="cambio"){
    tt = `Cambio turno · ${dataLunga(r.data)}`;
    sub = `${esc(p.nome)} propone lo scambio con ${esc(nomeDi(r.verso))}`;
  } else if(r.tipo==="ferie"){
    const gg = Math.round((daIso(r.al)-daIso(r.dal))/86400000)+1;
    tt = `Ferie · ${dataBreve(r.dal)} – ${dataBreve(r.al)}`;
    sub = `${esc(p.nome)} · ${gg} giorni · residuo dopo l'approvazione ${FERIE_ANNUE-ferieUsate(r.da)-(r.stato==="in_attesa"?gg:0)} gg`;
  } else {
    tt = `Permesso · ${dataLunga(r.data)}`;
    sub = `${esc(p.nome)} · ${r.dalle}–${r.alle} · ${nOre(r.ore)} ore`;
  }
  return `<div class="riga">
    <div class="main">
      <div class="tt">${tt}</div>
      <div class="sub">${sub} · richiesta il ${dataBreve(r.creata)}</div>
      ${r.messaggio?`<div class="note">${esc(r.messaggio)}</div>`:""}
      ${r.decisione&&r.decisione.nota?`<div class="note">${esc(r.decisione.da)}: ${esc(r.decisione.nota)}</div>`:""}
    </div>
    <div class="az">
      ${stChip(r.stato)}
      ${conAzioni && r.stato==="in_attesa" ? `
        <button class="btn sm ok" data-az="approva" data-id="${r.id}">Approva</button>
        <button class="btn sm no" data-az="rifiuta" data-id="${r.id}">Rifiuta</button>` : ""}
    </div>
  </div>`;
}

function navSett(){
  const k = settCorrente;
  return `<div class="btnrow" style="align-items:center">
    <button class="btn sm" data-az="sett-prec">←</button>
    <button class="btn sm" data-az="sett-oggi">Settimana corrente</button>
    <button class="btn sm" data-az="sett-succ">→</button>
    <span class="mini" style="margin-left:4px">${etichettaSett(k)} ${daIso(k).getFullYear()}</span>
  </div>`;
}

function griglia(k, editabile){
  const gg = giorniSett(k);
  const persone = personeSett(k);
  const testa = gg.map(d=>{
    const dt = daIso(d), oggi = d===iso(OGGI);
    return `<th class="${oggi?"col-oggi":""}">${GIORNI_B[(dt.getDay()+6)%7]}<span>${dt.getDate()} ${Mese(dt.getMonth()).slice(0,3)}</span></th>`;
  }).join("");

  const righe = persone.map(p=>{
    const tot = gg.reduce((s,d)=>s+oreTurno(turnoIn(p.id,d)),0);
    const celle = gg.map(d=>{
      const t = turnoIn(p.id,d), oggi = d===iso(OGGI);
      const dentro = t
        ? `${chipTurno(t)}<span class="hh">${orarioTurno(t)||"&nbsp;"}</span>${testoPausa(t)?`<span class="hh" style="color:var(--ink-3);font-size:11px">${testoPausa(t)}</span>`:""}`
        : (editabile ? `<span class="add">+</span>` : `<span class="hh" style="color:var(--ink-3)">riposo</span>`);
      return `<td class="${oggi?"col-oggi":""}">${
        editabile
          ? `<button class="cella" data-az="cella" data-p="${p.id}" data-d="${d}">${dentro}</button>`
          : `<div class="cella">${dentro}</div>`
      }</td>`;
    }).join("");
    return `<tr>
      <td class="persona">
        <div class="nm">${esc(p.nome)}${p.temporaneo?` <span class="st st-revisione">solo questa settimana</span>`:""}</div>
        <div class="ms">${p.mansione ? esc(p.mansione) : `<button class="pill-mans" data-az="mansione" data-p="${p.id}">+ mansione</button>`}</div>
        <div class="tot">${nOre(tot)} h${p.oreSett?` / ${p.oreSett}`:""}</div>
      </td>
      ${celle}
    </tr>`;
  }).join("");

  return `<div class="gridwrap"><table class="griglia">
    <thead><tr><th class="persona">Persona</th>${testa}</tr></thead>
    <tbody>${righe}</tbody>
  </table></div>`;
}

    ${scoperti.length ? `<div class="avviso">

function legaLogin(){
  const f = document.getElementById("f-login");
  if(f) f.onsubmit = async e => {
    e.preventDefault();
    const u = (document.getElementById("f-u").value||"").trim().toLowerCase();
    const pw = document.getElementById("f-p").value;
    const x = utente(u);
    if(!x){ erroreLogin = "Nome utente o password non corretti."; render(); return; }
    if(!x.hash){ utenteInCorso = u; motivoPw = "primo"; erroreLogin = ""; schermata = "password"; render(); return; }
    const h = await impronta(pw, x.salt);
    if(h !== x.hash){ erroreLogin = "Nome utente o password non corretti."; render(); return; }
    erroreLogin = ""; entra(u); render();
    avviso(x.ruolo==="super" ? "Accesso SuperUser" : `Accesso di ${x.nome}`);
  };
  const g = document.getElementById("f-pw");
  if(g) g.onsubmit = async e => {
    e.preventDefault();
    const u = utenteInCorso || (sess && sess.utente);
    const x = utente(u);
    const v = document.getElementById("f-vecchia");
    const n1 = document.getElementById("f-n1").value;
    const n2 = document.getElementById("f-n2").value;
    if(v && x.hash){
      const hv = await impronta(v.value, x.salt);
      if(hv !== x.hash){ erroreLogin = "La password attuale non è corretta."; render(); return; }
    }
    const problema = erroriPassword(n1);
    if(problema){ erroreLogin = problema; render(); return; }
    if(n1 !== n2){ erroreLogin = "Le due password non coincidono."; render(); return; }
    const salt = sale();
    const h = await impronta(n1, salt);
    if(h === x.hash){ erroreLogin = "La nuova password deve essere diversa dalla precedente."; render(); return; }
    x.salt = salt; x.hash = h; x.impostataIl = new Date().toISOString();
    salva(); erroreLogin = "";
    if(!sess || sess.utente !== u) entra(u);
    schermata = "app";
    if(!schede().some(k=>k.k===vista)) vista = schede()[0].k;
    render(); avviso("Password aggiornata");
  };
}

function apri(html, dopo){
  const v = document.createElement("div");
  v.className="velo";
  v.innerHTML = `<div class="modale" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(v);
  modale = v;
  v.addEventListener("click", e=>{ if(e.target===v) chiudi(); });
  v.querySelectorAll("[data-chiudi]").forEach(b=>b.onclick=chiudi);
  if(dopo) dopo(v);
  const f = v.querySelector("input,select,textarea"); if(f) f.focus();
}
function chiudi(){ if(modale){ modale.remove(); modale=null; } }
document.addEventListener("keydown", e=>{ if(e.key==="Escape") chiudi(); });

function modCella(pid, data){
  const t = turnoIn(pid,data);
  const opzioni = Object.entries(TIPI).map(([k,v])=>
    `<option value="${k}"${t&&t.tipo===k?" selected":""}>${v.nome}${v.lavoro?` (${v.inizio}–${v.fine})`:""}</option>`).join("");
  apri(`
    <h3>${esc(nomeDi(pid))} · ${dataLunga(data)} <button data-chiudi aria-label="Chiudi">×</button></h3>
    <div class="corpo">
      <label class="campo"><span>Turno</span><select id="f-tipo">${opzioni}</select></label>
      <div class="duo">
        <label class="campo"><span>Dalle</span><input id="f-in" type="time" value="${t&&TIPI[t.tipo].lavoro?(t.inizio||TIPI[t.tipo].inizio):"09:00"}"></label>
        <label class="campo"><span>Alle</span><input id="f-fi" type="time" value="${t&&TIPI[t.tipo].lavoro?(t.fine||TIPI[t.tipo].fine):"18:00"}"></label>
      </div>
      <div id="f-blocco-pausa">
        <div class="duo">
          <label class="campo"><span>Pausa dalle</span><input id="f-pda" type="time" value="${esc(pausaDi(t).da)}"></label>
          <label class="campo"><span>Pausa alle</span><input id="f-pa" type="time" value="${esc(pausaDi(t).a)}"></label>
        </div>
        <p class="regola" id="f-conteggio"></p>
      </div>
      <label class="campo"><span>Nota (facoltativa)</span><input id="f-nota" type="text" value="${t?esc(t.nota||""):""}" placeholder="es. copre l'ambulatorio 3"></label>
    </div>
    <div class="piede">
      ${t?`<button class="btn no" id="f-togli">Togli il turno</button>`:""}
      <button class="btn" data-chiudi>Annulla</button>
      <button class="btn gold" id="f-ok">Salva</button>
    </div>`, v=>{
    const selTipo = v.querySelector("#f-tipo");
    const cIn = v.querySelector("#f-in"), cFi = v.querySelector("#f-fi");
    const cPda = v.querySelector("#f-pda"), cPa = v.querySelector("#f-pa");
    const conteggio = v.querySelector("#f-conteggio");

    const aggiornaConteggio = ()=>{
      const tipo = selTipo.value;
      if(!TIPI[tipo].lavoro){ conteggio.textContent = ""; return; }
      const ore = oreNette(cIn.value, cFi.value, cPda.value, cPa.value);
      const lorde = oreNette(cIn.value, cFi.value, "", "");
      const pa = minuti(cPda.value), pb = minuti(cPa.value);
      const ia = minuti(cIn.value), fa = minuti(cFi.value);
      let avvertenza = "";
      if(pa!==null && pb!==null){
        if(pb <= pa) avvertenza = " ⚠️ la pausa finisce prima di cominciare: non viene tolta.";
        else if(ia!==null && fa!==null && (pa < ia || pb > fa)) avvertenza = " ⚠️ la pausa cade fuori dall'orario del turno.";
      }
      conteggio.innerHTML = `Ore conteggiate: <strong>${nOre(ore)}</strong>`
        + (lorde > ore ? ` (${nOre(lorde)} meno ${nOre(lorde-ore)} di pausa)` : " (nessuna pausa)")
        + esc(avvertenza);
    };

    const orari = ()=>{
      const T = TIPI[selTipo.value];
      const lavora = T.lavoro;
      cIn.closest(".duo").style.display = lavora || selTipo.value==="PR" ? "grid" : "none";
      v.querySelector("#f-blocco-pausa").style.display = lavora ? "block" : "none";
      if(lavora){
        cIn.value = T.inizio; cFi.value = T.fine;
        cPda.value = T.pausaDa || ""; cPa.value = T.pausaA || "";
      }
      aggiornaConteggio();
    };
    selTipo.onchange = orari;
    [cIn, cFi, cPda, cPa].forEach(c => c.oninput = aggiornaConteggio);
    aggiornaConteggio();

    v.querySelector("#f-ok").onclick = ()=>{
      const tipo = selTipo.value;
      const i = cIn.value, f = cFi.value;
      const pda = TIPI[tipo].lavoro ? cPda.value : "", pa = TIPI[tipo].lavoro ? cPa.value : "";
      let ore = null;
      if(TIPI[tipo].lavoro)      ore = oreNette(i, f, pda, pa);
      else if(tipo === "PR")     ore = oreNette(i, f, "", "");
      const nota = v.querySelector("#f-nota").value.trim();
      const campi = {tipo, ore, nota, inizio:TIPI[tipo].lavoro?i:null, fine:TIPI[tipo].lavoro?f:null, pausaDa:pda, pausaA:pa};
      if(t) Object.assign(t, campi);
      else S.turni.push({id:id(), persona:pid, data, ...campi});
      salva(); chiudi(); render(); avviso("Turno aggiornato");
    };
    if(t) v.querySelector("#f-togli").onclick = ()=>{
      S.turni = S.turni.filter(x=>x.id!==t.id); salva(); chiudi(); render(); avviso("Turno rimosso");
    };
  });
}

function applica(r){
  if(r.tipo==="ferie"){
    for(let d=daIso(r.dal); iso(d)<=r.al; d=piuGiorni(d,1)){
      if(d.getDay()===0) continue;
      const g = iso(d);
      const t = turnoIn(r.da,g);
      if(t){ t.tipo="F"; t.ore=0; }
      else S.turni.push({id:id(), persona:r.da, data:g, tipo:"F", ore:0, nota:""});
      assicuraSett(chiaveSett(d));
    }
  } else if(r.tipo==="permesso"){
    const t = turnoIn(r.da,r.data);
    if(t){ t.nota = `permesso ${r.dalle}–${r.alle}`; }
    S.turni.push({id:id(), persona:r.da, data:r.data, tipo:"PR", ore:r.ore, nota:""});
    assicuraSett(chiaveSett(daIso(r.data)));
  } else if(r.tipo==="cambio"){
    const t = S.turni.find(x=>x.id===r.turno) || turnoIn(r.da, r.data);
    if(t){ t.persona = r.verso; t.nota = `cambio da ${nomeDi(r.da)}`; }
  }
}

/* =========================================================
   ESPORTAZIONI — calendario (.ics) e PDF (stampa)
   ========================================================= */
function dueCifre(n){ return String(n).padStart(2,"0"); }
function icsData(d){ return d.replace(/-/g,""); }
function icsOra(d,o){ return icsData(d)+"T"+o.replace(":","")+"00"; }
function icsEsc(s){ return String(s??"").replace(/\\/g,"\\\\").replace(/;/g,"\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n"); }
function piega(r){
  if(r.length<=74) return r;
  let out = r.slice(0,74), resto = r.slice(74);
  while(resto.length){ out += "\r\n " + resto.slice(0,73); resto = resto.slice(73); }
  return out;
}
function turniDaEsportare(pid, dal, al, conAssenze){
  return S.turni
    .filter(t => t.persona===pid && t.data>=dal && t.data<=al &&
                 (TIPI[t.tipo].lavoro || (conAssenze && (t.tipo==="F" || t.tipo==="PR"))))
    .sort((a,b)=>a.data.localeCompare(b.data));
}
function calendarioIcs(pid, dal, al, conAssenze){
  const p = per(pid), n = new Date();
  const bollo = n.getUTCFullYear()+dueCifre(n.getUTCMonth()+1)+dueCifre(n.getUTCDate())+"T"
              + dueCifre(n.getUTCHours())+dueCifre(n.getUTCMinutes())+dueCifre(n.getUTCSeconds())+"Z";
  const r = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Rossi Clinic//Turni//IT","CALSCALE:GREGORIAN","METHOD:PUBLISH",
             "X-WR-CALNAME:"+icsEsc("Turni "+p.nome+" · Rossi Clinic"),"X-WR-TIMEZONE:Europe/Rome"];
  turniDaEsportare(pid,dal,al,conAssenze).forEach(t=>{
    const T = TIPI[t.tipo];
    r.push("BEGIN:VEVENT");
    r.push("UID:turno-"+t.id+"@turni.rossiclinic.it");
    r.push("DTSTAMP:"+bollo);
    if(T.lavoro){
      const da = t.inizio || T.inizio, a = t.fine || T.fine;
      const finisceDopo = minuti(a) <= minuti(da);
      r.push("DTSTART:"+icsOra(t.data,da));
      r.push("DTEND:"+icsOra(finisceDopo ? iso(piuGiorni(daIso(t.data),1)) : t.data, a));
      const pa = testoPausa(t);
      r.push("DESCRIPTION:"+icsEsc(nOre(oreTurno(t))+" ore"+(pa?" · "+pa:"")+(t.nota?" · "+t.nota:"")));
    } else {
      r.push("DTSTART;VALUE=DATE:"+icsData(t.data));
      r.push("DTEND;VALUE=DATE:"+icsData(iso(piuGiorni(daIso(t.data),1))));
      if(t.tipo==="PR" && t.ore) r.push("DESCRIPTION:"+icsEsc(nOre(t.ore)+" ore di permesso"));
    }
    r.push("SUMMARY:"+icsEsc(T.nome+" · Rossi Clinic"));
    r.push("LOCATION:"+icsEsc("Rossi Clinic, Bagnarola di Cesenatico"));
    r.push("END:VEVENT");
  });
  r.push("END:VCALENDAR");
  return r.map(piega).join("\r\n")+"\r\n";
}
function scarica(nome, testo, tipo){
  try{
    const b = new Blob([testo], {type:tipo+";charset=utf-8"});
    const u = URL.createObjectURL(b);
    const a = document.createElement("a");
    a.href = u; a.download = nome; a.style.display="none";
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(u); a.remove(); }, 1500);
    return true;
  }catch(e){ return false; }
}
function modCalendario(){
  const pid = ruolo, p = per(pid), k = settCorrente;
  apri(`
    <h3>Esporta il calendario <button data-chiudi aria-label="Chiudi">×</button></h3>
    <div class="corpo">
      <label class="campo"><span>Periodo</span><select id="f-per">
        <option value="sett">Solo la settimana ${etichettaSett(k)}</option>
        <option value="4" selected>Questa settimana e le tre successive</option>
        <option value="anno">Tutto il ${OGGI.getFullYear()}</option>
      </select></label>
      <label class="mini" style="display:flex;gap:8px;align-items:center;margin:-4px 0 12px">
        <input type="checkbox" id="f-ass" checked> Includi ferie e permessi
      </label>
      <p class="mini" id="f-conto" style="margin:0 0 12px"></p>
      <div class="avviso"><div>Il file è in formato .ics, lo standard dei calendari: si apre con Calendario su iPhone e su Mac, e va bene anche per Google Calendar e Outlook. Su iPhone: scarica il file, poi toccalo e scegli «Aggiungi tutti».<br><br>Se stai guardando questa pagina dentro Claude il download resta bloccato: usa «Copia il testo» e incollalo in un file chiamato <strong>turni.ics</strong>. Dal link condiviso al gruppo si scarica normalmente.</div></div>
      <label class="campo"><span>Contenuto del file</span><textarea id="f-ics" readonly rows="4" style="font-size:11px"></textarea></label>
    </div>
    <div class="piede">
      <button class="btn" data-chiudi>Chiudi</button>
      <button class="btn" id="f-copia">Copia il testo</button>
      <button class="btn gold" id="f-scarica">Scarica il file</button>
    </div>`,
  v=>{
    const agg = ()=>{
      const scelta = v.querySelector("#f-per").value;
      const conA = v.querySelector("#f-ass").checked;
      let dal, al;
      if(scelta==="sett"){ dal = k; al = giorniSett(k)[6]; }
      else if(scelta==="4"){ dal = k; al = giorniSett(chiaveSett(piuGiorni(daIso(k),21)))[6]; }
      else { dal = OGGI.getFullYear()+"-01-01"; al = OGGI.getFullYear()+"-12-31"; }
      const testo = calendarioIcs(pid, dal, al, conA);
      const n = (testo.match(/BEGIN:VEVENT/g)||[]).length;
      v.querySelector("#f-ics").value = testo;
      v.querySelector("#f-conto").textContent = n
        ? `${n} voci, dal ${dataBreve(dal)} al ${dataBreve(al)}.`
        : "In questo periodo non c'è niente da esportare.";
      return {testo, n};
    };
    v.querySelector("#f-per").onchange = agg;
    v.querySelector("#f-ass").onchange = agg;
    agg();
    v.querySelector("#f-scarica").onclick = ()=>{
      const {testo, n} = agg();
      if(!n){ avviso("Non c'è niente da esportare"); return; }
      const nome = "turni-"+p.nome.toLowerCase().replace(/[^a-z0-9]+/g,"-")+"-"+k+".ics";
      avviso(scarica(nome, testo, "text/calendar")
        ? "File del calendario pronto"
        : "Il download non è partito: usa «Copia il testo»");
    };
    v.querySelector("#f-copia").onclick = ()=>{
      const ta = v.querySelector("#f-ics");
      ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
      let ok = false;
      try{ ok = document.execCommand("copy"); }catch(e){}
      if(!ok && navigator.clipboard){
        navigator.clipboard.writeText(ta.value).then(()=>avviso("Testo copiato")).catch(()=>avviso("Copia a mano il testo qui sopra"));
        return;
      }
      avviso(ok ? "Testo copiato" : "Copia a mano il testo qui sopra");
    };
  });
}

function intestazioneStampa(titolo, sotto){
  return `<header class="pt-top">
    <div class="pt-marchio">Rossi Clinic</div>
    <div class="pt-tit">${esc(titolo)}</div>
    <div class="pt-sot">${esc(sotto)}</div>

}
function stampa(nomeDoc, html){
  const box = document.getElementById("stampa");
  box.innerHTML = `<div class="pt-doc">${html}
    <footer class="pt-pie">Rossi Clinic STP S.r.l. · documento generato il ${OGGI.getDate()} ${Mese(OGGI.getMonth())} ${OGGI.getFullYear()} · prototipo, dati di esempio</footer></div>`;
  const titoloPrima = document.title;
  document.title = nomeDoc;
  const ripristina = ()=>{ document.title = titoloPrima; window.removeEventListener("afterprint", ripristina); };
  window.addEventListener("afterprint", ripristina);
  setTimeout(()=>{
    try{
      window.print();
      avviso("Nella finestra di stampa scegli «Salva come PDF»");
    }catch(e){
      ripristina();
      avviso("La stampa non è disponibile qui: apri la pagina dal link condiviso");
    }
  }, 80);
}
function oreAnno(pid, anno){ let s=0; for(let m=0;m<12;m++) s+=oreMese(pid,anno,m); return s; }

function stampaSettimana(){
  const pid = ruolo, p = per(pid), k = settCorrente, gg = giorniSett(k);
  const righe = gg.map(d=>{
    const t = turnoIn(pid,d), T = t ? TIPI[t.tipo] : null;
    return `<tr>
      <td>${GIORNI[(daIso(d).getDay()+6)%7]} ${daIso(d).getDate()}</td>
      <td>${t ? esc(T.nome)+(t.tipo==="PR"&&t.ore?` (${nOre(t.ore)} h)`:"") : "Riposo"}</td>
      <td>${t ? (orarioTurno(t)||"—") : "—"}</td>
      <td>${(()=>{ if(!t) return "—"; const x=pausaDi(t); return x.da&&x.a ? x.da+"–"+x.a : "—"; })()}</td>
      <td class="num">${t ? nOre(oreTurno(t)) : "0"}</td></tr>`;
  }).join("");
  const ore = oreSett(pid,k), st = statoSett(k);
  stampa(`Turni ${p.nome} ${k}`,
    intestazioneStampa(`Turni della settimana ${etichettaSett(k)}`,
      `${p.nome}${p.mansione?" · "+p.mansione:""} · settimana ${st==="pubblicata"?"pubblicata":(st==="in_revisione"?"in revisione":"in bozza")}`) +
    `<table class="pt-tab">
      <thead><tr><th>Giorno</th><th>Turno</th><th>Orario</th><th>Pausa</th><th class="num">Ore</th></tr></thead>
      <tbody>${righe}</tbody>
      <tfoot><tr><th colspan="4">Totale della settimana</th><th class="num">${nOre(ore)} / ${p.oreSett}</th></tr></tfoot>
    </table>
    <p class="pt-nota">Le ore sono al netto della pausa. Ferie, permessi e riposi non contano come ore lavorate.</p>`);
}

function stampaOre(){
  const pid = ruolo, p = per(pid), anno = OGGI.getFullYear();
  const kOra = chiaveSett(OGGI);
  const oreS = oreSett(pid,kOra), oreM = oreMese(pid,anno,OGGI.getMonth()), oreA = oreAnno(pid,anno);
  const attese = p.oreSett*4.33;
  const sett = [];
  for(let w=-7; w<=0; w++){ const k = chiaveSett(piuGiorni(lunedi(OGGI), w*7)); sett.push({k, ore:oreSett(pid,k)}); }
  const mesi = [];
  for(let m=0; m<=OGGI.getMonth(); m++){
    const o = oreMese(pid,anno,m);
    if(o>0 || m===OGGI.getMonth()) mesi.push({m, ore:o});
  }
  const ferie = S.turni.filter(t=>t.persona===pid && t.tipo==="F" && daIso(t.data).getFullYear()===anno)
                       .sort((a,b)=>a.data.localeCompare(b.data));
  const perm  = S.turni.filter(t=>t.persona===pid && t.tipo==="PR" && daIso(t.data).getFullYear()===anno)
                       .sort((a,b)=>a.data.localeCompare(b.data));
  const orePerm = perm.reduce((s,t)=>s+(t.ore||0),0);

  const tile = (k,v,n)=>`<div class="pt-tile"><div class="k">${esc(k)}</div><div class="v">${v}</div><div class="n">${esc(n)}</div></div>`;

  stampa(`Ore ${p.nome} ${anno}`,
    intestazioneStampa(`Riepilogo ore ${anno}`, `${p.nome}${p.mansione?" · "+p.mansione:""} · contratto ${p.oreSett} ore a settimana`) +
    `<div class="pt-tiles">
      ${tile("Settimana in corso", nOre(oreS)+" h", etichettaSett(kOra))}
      ${tile("Mese in corso", nOre(oreM)+" h", Mese(OGGI.getMonth())+" "+anno)}
      ${tile("Totale anno", nOre(oreA)+" h", "dal 1 gennaio")}
      ${tile("Ferie residue", (FERIE_ANNUE-ferie.length)+" gg", ferie.length+" usate su "+FERIE_ANNUE)}
      ${tile("Permessi usati", nOre(orePerm)+" h", "su "+PERMESSI_ANNUI+" h l'anno")}
    </div>

    <div class="pt-h">Ultime otto settimane</div>
    <table class="pt-tab">
      <thead><tr><th>Settimana</th><th class="num">Ore</th><th class="num">Scarto sul contratto</th></tr></thead>
      <tbody>${sett.map(x=>{
        const d = x.ore - p.oreSett;
        return `<tr><td>${etichettaSett(x.k)}</td><td class="num">${nOre(x.ore)}</td>
          <td class="num">${d>0?"+":""}${nOre(d)}</td></tr>`;
      }).join("")}</tbody>
    </table>

    <div class="pt-h">Mese per mese</div>
    <table class="pt-tab">
      <thead><tr><th>Mese</th><th class="num">Ore</th><th class="num">Scarto su ${nOre(attese)} h teoriche</th></tr></thead>
      <tbody>${mesi.map(x=>{
        const d = x.ore - attese;
        return `<tr><td>${Mese(x.m)}</td><td class="num">${nOre(x.ore)}</td>
          <td class="num">${d>0?"+":""}${nOre(d)}</td></tr>`;
      }).join("")}</tbody>
      <tfoot><tr><th>Totale ${anno}</th><th class="num">${nOre(oreA)}</th><th class="num"></th></tr></tfoot>
    </table>

    <div class="pt-h">Ferie</div>
    <table class="pt-tab">
      <thead><tr><th>Giorno</th><th class="num">Conteggio</th></tr></thead>
      <tbody>${ferie.length
        ? ferie.map((t,i)=>`<tr><td>${dataLunga(t.data)}</td><td class="num">${i+1}° giorno</td></tr>`).join("")
        : `<tr><td colspan="2">Nessun giorno di ferie registrato nel ${anno}.</td></tr>`}</tbody>
      <tfoot><tr><th>Usate ${ferie.length} su ${FERIE_ANNUE}</th><th class="num">residue ${FERIE_ANNUE-ferie.length}</th></tr></tfoot>
    </table>

    <div class="pt-h">Permessi</div>
    <table class="pt-tab">
      <thead><tr><th>Giorno</th><th>Nota</th><th class="num">Ore</th></tr></thead>
      <tbody>${perm.length
        ? perm.map(t=>`<tr><td>${dataLunga(t.data)}</td><td>${esc(t.nota||"—")}</td><td class="num">${nOre(t.ore||0)}</td></tr>`).join("")
        : `<tr><td colspan="3">Nessun permesso registrato nel ${anno}.</td></tr>`}</tbody>
      <tfoot><tr><th colspan="2">Totale usato nel ${anno}, su ${PERMESSI_ANNUI} h l'anno</th><th class="num">${nOre(orePerm)}</th></tr></tfoot>
    </table>
    <p class="pt-nota">Ore effettivamente a turno, al netto della pausa. Ferie, permessi e riposi non contano come ore lavorate.</p>`);
}

    `<table class="pt-tab">

      <tbody>${righe}</tbody>
    </table>
    <p class="pt-nota">Le ore sono al netto della pausa.</p>`);
}

function azione(el){
  const a = el.dataset.az;
  switch(a){
    case "sett-prec": settCorrente = chiaveSett(piuGiorni(daIso(settCorrente),-7)); render(); break;
    case "sett-succ": settCorrente = chiaveSett(piuGiorni(daIso(settCorrente),7)); render(); break;
    case "sett-oggi": settCorrente = chiaveSett(OGGI); render(); break;
    case "cella": modCella(el.dataset.p, el.dataset.d); break;
    case "nuovo-cambio": modCambio(); break;
    case "nuove-ferie": modFerie(); break;
    case "nuovo-permesso": modPermesso(); break;
    case "ics": modCalendario(); break;
    case "pdf-settimana": stampaSettimana(); break;
    case "pdf-ore": stampaOre(); break;
    case "pdf-team": stampaTeam(settCorrente); break;
    case "approva": modDecidi(el.dataset.id, true); break;
    case "rifiuta": modDecidi(el.dataset.id, false); break;
    case "mansione": modMansione(el.dataset.p); break;
    case "aggiungi-persona": modPersona(true); break;
    case "aggiungi-fisso": modPersona(false); break;
    case "visto": modVisto(); break;
    case "azzera": azzera(); break;
    case "esci": esci(); break;
    case "cambia-pw":
      motivoPw = "scelta"; utenteInCorso = sess.utente; erroreLogin = ""; schermata = "password"; render(); break;
    case "annulla-pw":
      erroreLogin = ""; schermata = "app"; render(); break;
    case "azzera-pw": {
      const x = utente(el.dataset.u);
      if(x){ x.hash=null; x.salt=null; x.impostataIl=null; salva(); render();
        avviso(`${el.dataset.u}: password azzerata, la sceglierà al prossimo accesso`); }
      break;
    }
    case "fai-resp":
      S.persone.forEach(p=>p.responsabile = p.id===el.dataset.p);
      salva(); render(); avviso(`${nomeDi(el.dataset.p)} è ora responsabile dei turni`); break;
    case "in-revisione":
      assicuraSett(settCorrente).stato = "in_revisione";
      assicuraSett(settCorrente).vistoOwner = null;
      salva(); render(); avviso("Mandata ad Alexander per il last check"); break;
    case "pubblica":
      assicuraSett(settCorrente).stato = "pubblicata";
      salva(); render(); avviso("Settimana pubblicata, il team la vede"); break;
    case "in-bozza":
      assicuraSett(settCorrente).stato = "bozza";
      salva(); render(); avviso("Riportata in bozza"); break;
    case "copia-settimana": {
      const prec = chiaveSett(piuGiorni(daIso(settCorrente),-7));
      const gp = giorniSett(prec), gc = giorniSett(settCorrente);
      let n = 0;
      personeSett(settCorrente).forEach(p=>{
        gp.forEach((d,i)=>{
          const t = turnoIn(p.id,d);
          if(t && !turnoIn(p.id,gc[i]) && t.tipo!=="F" && t.tipo!=="PR"){
            S.turni.push({id:id(), persona:p.id, data:gc[i], tipo:t.tipo, ore:t.ore, nota:""}); n++;
          }
        });
      });
      salva(); render(); avviso(n?`${n} turni copiati`:"Niente da copiare"); break;
    }
  }
}

    return;
  }

  nav.hidden = false;
  const a = attuale();
  ruolo = a.personaId || "p1";

  if(!permesse.includes(vista)) vista = permesse[0];

}
